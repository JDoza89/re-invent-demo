version: 1
frontend:
  phases:
    preBuild:
      commands:
        - pnpm ci --cache .npm --prefer-offline
          - env | grep -e STORYBLOK_DELIVERY_API_TOKEN -e STORYBLOK_API_BASE_URL >> .env.production || true
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .pnpm/**/*
